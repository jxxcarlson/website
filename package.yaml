name: website
version: 0.1.0.0
synopsis: Personal website built with Hakyll
license: BSD-3-Clause
author: Author
maintainer: author@example.com

dependencies:
  - base >= 4.14 && < 5
  - hakyll >= 4.15 && < 5
  - pandoc
  - text
  - containers
  - directory
  - filepath
  - unix

executables:
  site:
    main: Site.hs
    source-dirs: src
    other-modules:
      - Scripta
      - Utils
      - Archive
    ghc-options:
      - -threaded
  grab-server:
    main: GrabServer.hs
    source-dirs: src
    other-modules:
      - Grab
    dependencies:
      - scotty
      - http-conduit
      - http-types
      - tagsoup
      - aeson
      - bytestring
      - wai
      - wai-cors
      - time
      - process
    ghc-options:
      - -threaded
