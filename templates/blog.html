<style>
body { position: relative; }
footer { border-top: none; }
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 60%;
  width: 40%;
  height: 100%;
  background-image: url('/media/images/music/jazz_harlem_IMG_3002.webp');
  background-size: cover;
  background-position: center;
  opacity: 1.0;
  z-index: -1;
  pointer-events: none;
}
body::after {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 20%;
  height: 100%;
  background-image: url('/media/images/art/rough.webp');
  background-size: cover;
  background-position: center;
  opacity: .70;
  z-index: -1;
  pointer-events: none;
}
/* Tablet: shrink sidebars */
@media (max-width: 1024px) {
  body::before {
    left: 75%;
    width: 25%;
    opacity: 0.7;
  }
  body::after {
    width: 10%;
    opacity: 0.5;
  }
}
/* Mobile: hide sidebars completely */
@media (max-width: 768px) {
  body::before,
  body::after {
    display: none;
  }
}
</style>

<style>
.tag-filters {
    margin-bottom: 1rem;
}
.tag-btn {
    background: #eee;
    border: 1px solid #ccc;
    padding: 0.25rem 0.5rem;
    margin-right: 0.25rem;
    margin-bottom: 0.25rem;
    cursor: pointer;
    border-radius: 3px;
    font-size: 0.9rem;
}
.tag-btn.active {
    background: #0066cc;
    color: white;
    border-color: #0066cc;
}
.tag-btn:hover {
    background: #ddd;
}
.tag-btn.active:hover {
    background: #0055aa;
}
.doc-count {
    font-size: 0.85rem;
    color: #888;
    margin-left: 0.5rem;
}
</style>

<div class="tag-filters">
    <button class="tag-btn active" data-tag="all">all</button>
    $for(tagList)$
    <button class="tag-btn" data-tag="$tag$">$tag$</button>
    $endfor$
    <span class="doc-count"></span>
</div>

<ul id="post-list">
    $for(posts)$
        <li data-tags="$tags$">
            <span class="post-date">$date$</span> &mdash;
            <a href="$url$">$title$</a>
        </li>
    $endfor$
</ul>

<script>
function updateCount() {
    const visible = document.querySelectorAll('#post-list li:not([style*="display: none"])').length;
    document.querySelector('.doc-count').textContent = visible + (visible === 1 ? ' post' : ' posts');
}
document.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        const tag = this.dataset.tag;
        document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        document.querySelectorAll('#post-list li').forEach(li => {
            const tags = li.dataset.tags ? li.dataset.tags.split(' ') : [];
            if (tag === 'all' || tags.includes(tag)) {
                li.style.display = '';
            } else {
                li.style.display = 'none';
            }
        });
        updateCount();
    });
});
updateCount();
</script>
