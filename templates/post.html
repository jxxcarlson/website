<article>
    <header>
        <div class="post-nav-row">
            $if(prevUrl)$<a href="$prevUrl$" class="nav-btn nav-prev">&larr; Prev</a>$else$<span class="nav-btn nav-disabled">&larr; Prev</span>$endif$
            <span class="post-date">Posted on $date$</span>
            $if(nextUrl)$<a href="$nextUrl$" class="nav-btn nav-next">Next &rarr;</a>$else$<span class="nav-btn nav-disabled">Next &rarr;</span>$endif$
        </div>
    </header>
    <section>
        $body$
    </section>
    <footer class="post-footer">
        <p class="word-count">$wordcount$ words</p>
    </footer>
</article>
