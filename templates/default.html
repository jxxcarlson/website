<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$title$ - My Site</title>
    <link rel="stylesheet" href="/css/default.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body);"></script>
    <style>
    .protected-link { color: #999; }
    .protected-link.authenticated { color: inherit; }
    .protected-hidden { display: none; }
    .protected-hidden.authenticated { display: inline; }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="/">Home</a>
            <a href="/grab.html">Grab</a>
            <a href="/notes/">Notes</a>
            <a href="/blog.html">Blog</a>
            <a href="/photography/">Photography</a>
            <a href="/music/">Music</a>
            <a href="/art/">Art</a>
            <a href="/reading/">Reading</a>
            <a href="/projects.html">Code</a>
            <a href="/diary/" class="protected-link protected-hidden">Diary</a>
            <a href="/memoirs/" class="protected-link protected-hidden">Memoirs</a>
            <a href="/drafts/" class="protected-link">Drafts</a>
            <a href="/about.html">About</a>
        </nav>
    </header>
    <script>
    // Check authentication status for protected links
    fetch('/drafts/.auth-check', { method: 'HEAD', redirect: 'manual' })
        .then(function(response) {
            if (response.ok) {
                document.querySelectorAll('.protected-link').forEach(function(el) {
                    el.classList.add('authenticated');
                });
            }
        })
        .catch(function() {});
    </script>
    <script>
    (function() {
        function stripTrailingSlash(s) {
            return s.length > 1 && s.charAt(s.length - 1) === '/' ? s.slice(0, -1) : s;
        }
        var path = window.location.pathname;
        var links = document.querySelectorAll('nav a');
        for (var i = 0; i < links.length; i++) {
            var linkPath = new URL(links[i].href).pathname;
            var linkBase = stripTrailingSlash(linkPath.replace('.html', ''));
            var pathBase = stripTrailingSlash(path.replace('.html', ''));
            if (linkPath === '/' && path === '/') {
                links[i].classList.add('active');
            } else if (linkPath !== '/' && pathBase.indexOf(linkBase) === 0) {
                links[i].classList.add('active');
            }
            // Highlight nav items when viewing their content
            if (linkPath === '/blog.html' && path.indexOf('/posts/') === 0) {
                links[i].classList.add('active');
            }
            if (linkPath === '/notes/' && path.indexOf('/archive/') === 0) {
                links[i].classList.add('active');
            }
            if (linkPath === '/diary/' && path.indexOf('/diary/') === 0) {
                links[i].classList.add('active');
            }
        }
    })();
    </script>

    <main>
        <h1>$title$</h1>
        <nav id="toc" class="table-of-contents" style="display:none;"></nav>
        $body$
    </main>
    <script>
    // Auto-generate table of contents from h1/h2/h3 headers
    // Skips the first h1 (page title), includes subsequent h1s as top-level
    (function() {
        const main = document.querySelector('main');
        const toc = document.getElementById('toc');
        if (!main || !toc) return;

        const allHeaders = main.querySelectorAll('h1, h2, h3');
        // Skip the first h1 (page title)
        const headers = Array.from(allHeaders).filter((h, i) => !(h.tagName === 'H1' && i === 0));
        if (headers.length < 2) return; // Only show TOC if 2+ headers

        const list = document.createElement('ul');
        let currentTopItem = null;
        let currentSublist = null;
        let currentSubSublist = null;

        headers.forEach((header, index) => {
            // Ensure header has an ID for linking
            if (!header.id) {
                header.id = 'section-' + index;
            }

            const li = document.createElement('li');
            const link = document.createElement('a');
            link.href = '#' + header.id;
            link.textContent = header.textContent;

            if (header.tagName === 'H1') {
                // Top level
                li.appendChild(link);
                list.appendChild(li);
                currentTopItem = li;
                currentSublist = null;
                currentSubSublist = null;
            } else if (header.tagName === 'H2') {
                if (currentTopItem) {
                    // Nested under h1
                    if (!currentSublist) {
                        currentSublist = document.createElement('ul');
                        currentTopItem.appendChild(currentSublist);
                    }
                    li.appendChild(link);
                    currentSublist.appendChild(li);
                    currentSubSublist = null;
                } else {
                    // No h1 parent, treat as top level
                    li.appendChild(link);
                    list.appendChild(li);
                    currentTopItem = li;
                    currentSublist = null;
                }
            } else if (header.tagName === 'H3') {
                if (currentSublist) {
                    // Nested under h2
                    const parentLi = currentSublist.lastElementChild;
                    if (parentLi) {
                        if (!currentSubSublist || currentSubSublist.parentElement !== parentLi) {
                            currentSubSublist = document.createElement('ul');
                            parentLi.appendChild(currentSubSublist);
                        }
                        li.appendChild(link);
                        currentSubSublist.appendChild(li);
                    }
                } else if (currentTopItem) {
                    // No h2, nest directly under h1
                    if (!currentSublist) {
                        currentSublist = document.createElement('ul');
                        currentTopItem.appendChild(currentSublist);
                    }
                    li.appendChild(link);
                    currentSublist.appendChild(li);
                } else {
                    // Fallback: add to main list
                    li.appendChild(link);
                    list.appendChild(li);
                }
            }
        });

        toc.innerHTML = '<strong>Contents</strong>';
        toc.appendChild(list);
        toc.style.display = 'block';
    })();
    </script>

    <footer>
        <p>Built with <a href="https://jaspervdj.be/hakyll/">Hakyll</a></p>
    </footer>

    <!-- Lightbox for expandable images -->
    <div class="lightbox-overlay" id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">✕</button>
        <img id="lightbox-img" src="" alt="" onclick="closeLightbox()">
    </div>
    <script>
    function openLightbox(src) {
        document.getElementById('lightbox-img').src = src;
        document.getElementById('lightbox').classList.add('active');
        document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
        document.getElementById('lightbox').classList.remove('active');
        document.body.style.overflow = '';
    }
    document.getElementById('lightbox').addEventListener('click', function(e) {
        if (e.target === this) closeLightbox();
    });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeLightbox();
            returnFromCitation();
        }
    });
    </script>
    <!-- Citation/bibliography navigation -->
    <script>
    var citationReturnPosition = null;
    var highlightedBibitem = null;

    function returnFromCitation() {
        if (citationReturnPosition !== null) {
            window.scrollTo({ top: citationReturnPosition, behavior: 'smooth' });
            citationReturnPosition = null;
        }
        if (highlightedBibitem) {
            highlightedBibitem.classList.remove('highlighted');
            highlightedBibitem = null;
        }
    }

    document.addEventListener('click', function(e) {
        var citation = e.target.closest('.citation');
        if (citation) {
            e.preventDefault();
            // Save current scroll position for ESC return
            citationReturnPosition = window.scrollY;
            // Clear previous highlight
            if (highlightedBibitem) {
                highlightedBibitem.classList.remove('highlighted');
            }
            // Find and highlight the bibitem
            var targetId = citation.getAttribute('href').substring(1);
            var bibitem = document.getElementById(targetId);
            if (bibitem) {
                bibitem.scrollIntoView({ behavior: 'smooth', block: 'center' });
                bibitem.classList.add('highlighted');
                highlightedBibitem = bibitem;
            }
        }
    });
    </script>
    <script src="/js/dynamic-loader.js"></script>
    <script>
    // Update navigation buttons based on filtered list from sessionStorage
    (function() {
        const path = window.location.pathname;

        // Check if we're on an individual post or note page
        const isPostPage = path.startsWith('/posts/');
        const isNotePage = path.startsWith('/archive/');
        if (!isPostPage && !isNotePage) return;

        // Get the appropriate filtered URLs
        const storageKey = isPostPage ? 'filteredPostUrls' : 'filteredNoteUrls';
        const stored = sessionStorage.getItem(storageKey);
        if (!stored) return;

        const urls = JSON.parse(stored);
        if (!urls || urls.length <= 1) return;

        // Find current page in the filtered list
        const currentIndex = urls.indexOf(path);
        if (currentIndex === -1) return;

        // Calculate prev/next in filtered list (circular navigation)
        const prevIndex = (currentIndex + 1) % urls.length;
        const nextIndex = (currentIndex - 1 + urls.length) % urls.length;

        // Update all navigation buttons (top and bottom)
        document.querySelectorAll('.nav-next').forEach(navNext => {
            if (navNext.tagName === 'A') {
                navNext.href = urls[nextIndex];
            } else if (navNext.tagName === 'SPAN') {
                const link = document.createElement('a');
                link.href = urls[nextIndex];
                link.className = 'nav-btn nav-next';
                link.innerHTML = navNext.innerHTML;
                navNext.parentNode.replaceChild(link, navNext);
            }
        });

        document.querySelectorAll('.nav-prev').forEach(navPrev => {
            if (navPrev.tagName === 'A') {
                navPrev.href = urls[prevIndex];
            } else if (navPrev.tagName === 'SPAN') {
                const link = document.createElement('a');
                link.href = urls[prevIndex];
                link.className = 'nav-btn nav-prev';
                link.innerHTML = navPrev.innerHTML;
                navPrev.parentNode.replaceChild(link, navPrev);
            }
        });
    })();
    </script>
</body>
</html>
