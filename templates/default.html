<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$title$ - My Site</title>
    <link rel="stylesheet" href="/css/default.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body);"></script>
</head>
<body>
    <header>
        <nav>
            <a href="/">Home</a>
            <a href="/notes/">Notes</a>
            <a href="/blog.html">Blog</a>
            <a href="/photography/">Photography</a>
            <a href="/music/">Music</a>
            <a href="/art/">Art</a>
            <a href="/projects.html">Code</a>
            <a href="/about.html">About</a>
        </nav>
    </header>
    <script>
    (function() {
        var path = window.location.pathname;
        var links = document.querySelectorAll('nav a');
        for (var i = 0; i < links.length; i++) {
            var href = links[i].getAttribute('href');
            var hrefBase = href.replace('.html', '');
            if (hrefBase.charAt(hrefBase.length - 1) === '/') {
                hrefBase = hrefBase.slice(0, -1);
            }
            if (href === '/' && path === '/') {
                links[i].classList.add('active');
            } else if (href !== '/' && path.indexOf(hrefBase) === 0) {
                links[i].classList.add('active');
            }
        }
    })();
    </script>

    <main>
        <h1>$title$</h1>
        $body$
    </main>

    <footer>
        <p>Built with <a href="https://jaspervdj.be/hakyll/">Hakyll</a></p>
    </footer>
</body>
</html>
