<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$title$ - My Site</title>
    <link rel="stylesheet" href="/css/default.css">
    <style>
        html {
            background-color: #0d0d0d !important;
        }
        body {
            background-color: #0a0a0a !important;
            color: #e0e0e0;
        }
        header {
            border-bottom-color: #333;
        }
        nav a {
            color: #b0b0b0;
        }
        nav a:hover {
            color: #ffffff;
        }
        nav a.active {
            font-weight: bold;
            color: #e8e8e8;
            text-decoration: underline;
        }
        a {
            color: #b0b0b0;
        }
        a:hover {
            color: #ffffff;
        }
        footer {
            border-top: none;
            color: #888;
        }
        h1, h2, h3 {
            color: #e8e8e8;
        }
        figcaption {
            color: #aaa;
        }
        /* Slideshow styles */
        .slideshow {
            text-align: center;
            margin: 0 0 2rem 0;
        }
        .slide {
            display: none;
        }
        .slide.active {
            display: block;
        }
        .slide img {
            max-width: 100%;
            height: auto;
        }
        .slide-caption {
            font-size: 0.9em;
            color: #aaa;
            margin-top: 0.5rem;
        }
        .slideshow-controls {
            margin-top: 1rem;
            display: flex;
            flex-wrap: nowrap;
            justify-content: center;
            align-items: baseline;
            gap: 0.3rem;
        }
        .slide-btn {
            background: #333;
            border: none;
            color: #ccc;
            font-size: 0.9rem;
            padding: 0.25rem 0.5rem;
            cursor: pointer;
            border-radius: 3px;
            transition: background 0.2s, color 0.2s;
            line-height: 1;
        }
        .slide-btn:hover {
            background: #444;
            color: #fff;
        }
        .slide-counter {
            color: #888;
            font-size: 0.85rem;
            min-width: 3rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="/">Home</a>
            <a href="/notes/">Notes</a>
            <a href="/blog.html">Blog</a>
            <a href="/photography/">Photography</a>
            <a href="/music/">Music</a>
            <a href="/art/">Art</a>
            <a href="/projects.html">Code</a>
            <a href="/about.html">About</a>
        </nav>
    </header>
    <script>
    (function() {
        function stripTrailingSlash(s) {
            return s.length > 1 && s.charAt(s.length - 1) === '/' ? s.slice(0, -1) : s;
        }
        var path = window.location.pathname;
        var links = document.querySelectorAll('nav a');
        for (var i = 0; i < links.length; i++) {
            var linkPath = new URL(links[i].href).pathname;
            var linkBase = stripTrailingSlash(linkPath.replace('.html', ''));
            var pathBase = stripTrailingSlash(path.replace('.html', ''));
            if (linkPath === '/' && path === '/') {
                links[i].classList.add('active');
            } else if (linkPath !== '/' && pathBase.indexOf(linkBase) === 0) {
                links[i].classList.add('active');
            }
        }
    })();
    </script>

    <main>
        <h1>$title$</h1>
        $body$
    </main>

    <footer>
    </footer>
</body>
</html>
