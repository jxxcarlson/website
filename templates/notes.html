<style>
.title-row {
    display: flex;
    align-items: baseline;
    gap: 15px;
}
.title-row h1 {
    margin: 0;
}
.search-box {
    transform: translateY(-5px);
}
.search-box input {
    padding: 0.3rem 0.5rem;
    border: 1px solid #ccc;
    border-radius: 3px;
    font-size: 0.9rem;
    width: 180px;
}
.search-box input:focus {
    outline: none;
    border-color: #0066cc;
}
.tag-filters {
    margin-top: 11px;
    margin-bottom: 1rem;
}
.tag-btn {
    background: #eee;
    border: 1px solid #ccc;
    padding: 0.25rem 0.5rem;
    margin-right: 0.25rem;
    margin-bottom: 0.25rem;
    cursor: pointer;
    border-radius: 3px;
    font-size: 0.9rem;
}
.tag-btn.active {
    background: #0066cc;
    color: white;
    border-color: #0066cc;
}
.tag-btn:hover {
    background: #ddd;
}
.tag-btn.active:hover {
    background: #0055aa;
}
.doc-count {
    font-size: 0.85rem;
    color: #888;
    margin-left: 0.5rem;
}
</style>

<div class="search-box">
    <input type="text" id="search-input" placeholder="Search...">
</div>

<div class="tag-filters">
    <button class="tag-btn active" data-tag="all">all</button>
    $for(tagList)$
    <button class="tag-btn" data-tag="$tag$">$tag$</button>
    $endfor$
    <span class="doc-count"></span>
</div>

<ul id="notes-list">
    $for(notes)$
        <li data-tags="$tags$" data-content="$content$">
            <a href="$url$">$title$</a>
        </li>
    $endfor$
</ul>

<script>
function updateCount() {
    const visible = document.querySelectorAll('#notes-list li:not([style*="display: none"])').length;
    document.querySelector('.doc-count').textContent = visible + (visible === 1 ? ' note' : ' notes');
}

function getActiveTag() {
    const activeBtn = document.querySelector('.tag-btn.active');
    return activeBtn ? activeBtn.dataset.tag : 'all';
}

function getSearchTerms() {
    const input = document.getElementById('search-input');
    return input.value.toLowerCase().split(/\s+/).filter(t => t.length > 0);
}

function filterItems() {
    const tag = getActiveTag();
    const searchTerms = getSearchTerms();

    document.querySelectorAll('#notes-list li').forEach(li => {
        const tags = li.dataset.tags ? li.dataset.tags.split(' ') : [];
        const title = li.textContent.toLowerCase();
        const content = (li.dataset.content || '').toLowerCase();
        const searchText = title + ' ' + content;

        const matchesTag = (tag === 'all' || tags.includes(tag));
        const matchesSearch = searchTerms.length === 0 ||
            searchTerms.every(term => searchText.includes(term));

        li.style.display = (matchesTag && matchesSearch) ? '' : 'none';
    });
    updateCount();
}

document.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        filterItems();
    });
});

document.getElementById('search-input').addEventListener('input', filterItems);

// Move search box next to title
const h1 = document.querySelector('main h1');
const searchBox = document.querySelector('.search-box');
if (h1 && searchBox) {
    const titleRow = document.createElement('div');
    titleRow.className = 'title-row';
    h1.parentNode.insertBefore(titleRow, h1);
    titleRow.appendChild(h1);
    titleRow.appendChild(searchBox);
}

filterItems();
</script>
