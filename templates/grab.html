<div id="grab-app">
    <div class="grab-form">
        <input type="text" id="grab-url" placeholder="Enter URL to grab..." class="grab-input">
        <input type="text" id="grab-tags" placeholder="Tags" class="grab-input grab-tags-input">
        <div class="grab-options">
            <label><input type="radio" name="grab-format" value="md" checked> Markdown</label>
            <label><input type="radio" name="grab-format" value="scripta"> Scripta</label>
        </div>
        <button id="grab-btn" class="grab-button grab-protected" disabled onclick="doGrab()">Grab</button>
        <button id="archive-btn" class="grab-button grab-archive-btn grab-protected" disabled onclick="doGrabToArchive()">Save to Archive</button>
    </div>
    <div id="grab-status" class="grab-status"></div>
    <div id="grab-preview" class="grab-preview"></div>
</div>

<script src="/js/grab.js"></script>
<script>
// Enable grab buttons: always on localhost, auth-check on deployed site
(function() {
    function enableGrab() {
        document.querySelectorAll('.grab-protected').forEach(function(el) {
            el.disabled = false;
        });
    }
    var host = window.location.hostname;
    if (host === 'localhost' || host === '127.0.0.1') {
        enableGrab();
    } else {
        fetch('/drafts/.auth-check', { method: 'HEAD', redirect: 'manual' })
            .then(function(response) { if (response.ok) enableGrab(); })
            .catch(function() {});
    }
})();
</script>
