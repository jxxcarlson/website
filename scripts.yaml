scripts:
  start: sh scripts/refresh.sh
  refresh: sh scripts/refresh.sh
  ci: sh scripts/convert-images.sh
  deploy: sh scripts/deploy.sh
  watch: |
    pkill -f watch_and_deploy.sh || true
    sleep 1
    (bash scripts/watch_and_deploy.sh >> /tmp/watch_and_deploy.log 2>&1 &)
    echo "Watcher started. Log: /tmp/watch_and_deploy.log"
  kill: pkill -f watch_and_deploy.sh
  wl: sh scripts/watch_local.sh &
  log: tail -f /tmp/watch_and_deploy.log
  running: ps aux | grep watch_and_deploy | grep -v grepvr

