<style>
body { position: relative; }
footer { border-top: none; }
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 60%;
  width: 40%;
  height: 100%;
  background-image: url('/media/images/music/jazz_harlem_IMG_3002.webp');
  background-size: cover;
  background-position: center;
  opacity: 1.0;
  z-index: -1;
  pointer-events: none;
}
body::after {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 20%;
  height: 100%;
  background-image: url('/media/images/art/rough.webp');
  background-size: cover;
  background-position: center;
  opacity: .70;
  z-index: -1;
  pointer-events: none;
}
/* Tablet: shrink sidebars */
@media (max-width: 799px) {
  body::before {
    left: 75%;
    width: 25%;
    opacity: 0.7;
  }
  body::after {
    width: 10%;
    opacity: 0.5;
  }
}
/* Mobile: hide sidebars completely */
@media (max-width: 768px) {
  body::before,
  body::after {
    display: none;
  }
}
</style>

<style>
.title-row {
    display: flex;
    align-items: baseline;
    gap: 15px;
}
.title-row h1 {
    margin: 0;
}
.search-box {
    transform: translateY(-5px);
}
.search-box input {
    padding: 0.3rem 0.5rem;
    border: 1px solid #ccc;
    border-radius: 3px;
    font-size: 0.9rem;
    width: 180px;
}
.search-box input:focus {
    outline: none;
    border-color: #0066cc;
}
.tag-filters {
    margin-top: 11px;
    margin-bottom: 1rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem;
    max-width: 450px;
}
.tag-btn {
    background: #eee;
    border: 1px solid #ccc;
    padding: 0.25rem 0.5rem;
    margin-right: 0.25rem;
    margin-bottom: 0.25rem;
    cursor: pointer;
    border-radius: 3px;
    font-size: 0.9rem;
}
.tag-btn.active {
    background: #0066cc;
    color: white;
    border-color: #0066cc;
}
.tag-btn:hover {
    background: #ddd;
}
.tag-btn.active:hover {
    background: #0055aa;
}
.doc-count {
    font-size: 0.85rem;
    color: #888;
    margin-left: 0.5rem;
}
.sort-controls {
    margin-top: 0.5rem;
    margin-bottom: 0.75rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}
.sort-label {
    font-size: 0.85rem;
    color: #666;
}
.sort-btn {
    background: #f5f5f5;
    border: 1px solid #ddd;
    padding: 0.2rem 0.5rem;
    cursor: pointer;
    border-radius: 3px;
    font-size: 0.85rem;
    color: #555;
}
.sort-btn.active {
    background: #0066cc;
    color: white;
    border-color: #0066cc;
}
.sort-btn:hover:not(.active) {
    background: #eee;
}
</style>

<div class="two-column-container">
    <div class="list-column">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search...">
        </div>

        <div class="tag-filters">
            <button class="tag-btn active" data-tag="all">all</button>
            $for(tagList)$
            <button class="tag-btn" data-tag="$tag$">$tag$</button>
            $endfor$
            <button class="tag-btn random-btn">random</button>
            <span class="doc-count"></span>
        </div>

        <div class="sort-controls">
            <button class="sort-btn active" data-sort="created">Created</button>
            <button class="sort-btn" data-sort="modified">Modified</button>
            <button class="sort-btn" data-sort="alpha">A-Z</button>
            <button class="sort-btn" data-sort="seq-asc">Seq&#8593;</button>
            <button class="sort-btn" data-sort="seq-desc">Seq&#8595;</button>
        </div>

        <ul id="post-list">
            $for(posts)$
                <li data-tags="$tags$" data-content="$content$" data-url="$url$" data-mtime="$mtime$" data-title="$title$">
                    <a href="$url$">$title$</a>
                    <span class="post-date-small">$date$</span>
                </li>
            $endfor$
        </ul>
    </div>

    <div class="content-column">
        <div class="content-placeholder">Select a post to view</div>
        <article class="dynamic-content" style="display: none;"></article>
    </div>
</div>

<script>
function updateCount() {
    const visible = document.querySelectorAll('#post-list li:not([style*="display: none"])').length;
    document.querySelector('.doc-count').textContent = visible + (visible === 1 ? ' post' : ' posts');
}

let lastActiveTag = 'all';
function getActiveTag() {
    const activeBtn = document.querySelector('.tag-btn.active:not(.random-btn)');
    if (activeBtn) {
        lastActiveTag = activeBtn.dataset.tag;
    }
    return lastActiveTag;
}

function getSearchTerms() {
    const input = document.getElementById('search-input');
    return input.value.toLowerCase().split(/\s+/).filter(t => t.length > 0);
}

function filterItems() {
    const tag = getActiveTag();
    const searchTerms = getSearchTerms();

    document.querySelectorAll('#post-list li').forEach(li => {
        const tags = li.dataset.tags ? li.dataset.tags.split(' ') : [];
        const title = li.textContent.toLowerCase();
        const content = (li.dataset.content || '').toLowerCase();
        const searchText = title + ' ' + content;

        const matchesTag = (tag === 'all' || tags.includes(tag));
        const matchesSearch = searchTerms.length === 0 ||
            searchTerms.every(term => searchText.includes(term));

        li.style.display = (matchesTag && matchesSearch) ? '' : 'none';
    });
    updateCount();
    storeFilteredNavigation();
    if (window.selectFirstVisible) window.selectFirstVisible();
}

// Store filtered URLs for navigation on individual post pages
function storeFilteredNavigation() {
    const visibleItems = Array.from(document.querySelectorAll('#post-list li:not([style*="display: none"])'));
    const urls = visibleItems.map(li => li.dataset.url).filter(u => u);
    sessionStorage.setItem('filteredPostUrls', JSON.stringify(urls));
}

// Store original creation order (items are already sorted by creation date server-side)
// Also extract sequence property from content if present
let hasAnySequence = false;
document.querySelectorAll('#post-list li').forEach((li, index) => {
    li.dataset.createdIndex = index;
    // Extract sequence:N from content
    const content = li.dataset.content || '';
    const seqMatch = content.match(/sequence:(\d+)/);
    if (seqMatch) {
        li.dataset.seq = seqMatch[1];
        hasAnySequence = true;
    }
});

// Hide seq buttons if no items have sequence property
if (!hasAnySequence) {
    document.querySelectorAll('.sort-btn[data-sort^="seq-"]').forEach(btn => {
        btn.style.display = 'none';
    });
}

// Current sort state
let currentSort = 'created';

// Strip leading articles for alphabetical sorting
function stripArticles(title) {
    return title.replace(/^(a |an |the )/i, '').toLowerCase();
}

// Sort items based on current sort mode
function sortItems() {
    const list = document.getElementById('post-list');
    const items = Array.from(list.querySelectorAll('li'));

    items.sort((a, b) => {
        switch (currentSort) {
            case 'created':
                // Original order (lowest index = most recent)
                return parseInt(a.dataset.createdIndex) - parseInt(b.dataset.createdIndex);
            case 'modified':
                // Higher mtime = more recently modified, so reverse
                return parseInt(b.dataset.mtime || 0) - parseInt(a.dataset.mtime || 0);
            case 'alpha':
                // Alphabetical by title, ignoring articles
                const titleA = stripArticles(a.dataset.title || a.textContent);
                const titleB = stripArticles(b.dataset.title || b.textContent);
                return titleA.localeCompare(titleB);
            case 'seq-asc':
                // Sequence ascending (1, 2, 3...), items without sequence go to end
                const seqA = a.dataset.seq ? parseInt(a.dataset.seq) : Infinity;
                const seqB = b.dataset.seq ? parseInt(b.dataset.seq) : Infinity;
                return seqA - seqB;
            case 'seq-desc':
                // Sequence descending (3, 2, 1...), items without sequence go to end
                const seqAd = a.dataset.seq ? parseInt(a.dataset.seq) : -Infinity;
                const seqBd = b.dataset.seq ? parseInt(b.dataset.seq) : -Infinity;
                return seqBd - seqAd;
            default:
                return 0;
        }
    });

    // Reorder DOM elements
    items.forEach(item => list.appendChild(item));

    // Reapply filter to maintain visibility state
    filterItems();
}

// Sort button handlers
document.querySelectorAll('.sort-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        // Deactivate random button if active
        document.querySelector('.random-btn').classList.remove('active');

        // Update active state
        document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');

        currentSort = this.dataset.sort;
        sortItems();
    });
});

document.querySelectorAll('.tag-btn:not(.random-btn)').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        filterItems();
    });
});

document.getElementById('search-input').addEventListener('input', filterItems);

document.querySelector('.random-btn').addEventListener('click', function() {
    const tag = getActiveTag();
    const searchTerms = getSearchTerms();
    document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    // Get all items matching current tag/search filter
    const allItems = Array.from(document.querySelectorAll('#post-list li'));
    const eligible = allItems.filter(li => {
        const tags = li.dataset.tags ? li.dataset.tags.split(' ') : [];
        const title = li.textContent.toLowerCase();
        const content = (li.dataset.content || '').toLowerCase();
        const searchText = title + ' ' + content;
        const matchesTag = (tag === 'all' || tags.includes(tag));
        const matchesSearch = searchTerms.length === 0 ||
            searchTerms.every(term => searchText.includes(term));
        return matchesTag && matchesSearch;
    });
    if (eligible.length > 0) {
        // Shuffle using Fisher-Yates
        const shuffled = [...eligible];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        const selected = shuffled.slice(0, 3);
        // Only sort alphabetically when picking a subset
        if (eligible.length > 3) {
            selected.sort((a, b) => {
                const titleA = a.querySelector('a').textContent.toLowerCase();
                const titleB = b.querySelector('a').textContent.toLowerCase();
                return titleA.localeCompare(titleB);
            });
        }
        // Hide all, show only selected
        allItems.forEach(li => li.style.display = 'none');
        selected.forEach(li => li.style.display = '');
        // Move selected to top of list in sorted order
        const list = document.getElementById('post-list');
        for (let i = selected.length - 1; i >= 0; i--) {
            list.prepend(selected[i]);
        }
        updateCount();
        storeFilteredNavigation();
        if (window.selectFirstVisible) window.selectFirstVisible();
    }
});

// Move search box next to title
const h1 = document.querySelector('main h1');
const searchBox = document.querySelector('.search-box');
if (h1 && searchBox) {
    const titleRow = document.createElement('div');
    titleRow.className = 'title-row';
    h1.parentNode.insertBefore(titleRow, h1);
    titleRow.appendChild(h1);
    titleRow.appendChild(searchBox);
}

// Add two-column class to body on desktop
if (window.matchMedia('(min-width: 800px)').matches) {
    document.body.classList.add('two-column-page');
}

filterItems();
</script>
